name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: ALSA headers for cpal
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
        working-directory: .
      - name: Fetch the sherpa-onnx libraries once and point the build at them
        shell: bash
        # One integration test of hayamimi-gpu (rp17) reads this at compile time and is not run here.
        # rp19 lists the tests of the whole workspace, which compiles it.
        run: cargo build --release -p sherpa-onnx-sys && echo "SHERPA_ONNX_LIB_DIR=$(pwd -W 2>/dev/null || pwd)/target/sherpa-onnx-prebuilt/$(ls target/sherpa-onnx-prebuilt | head -1)/lib" >> "$GITHUB_ENV"
      - name: ripgrep for the import counter of rp27 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep
        working-directory: .
      - name: ripgrep for the import counter of rp27 (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
        working-directory: .
      - name: Build the stand-in programs of r8g_media
        run: cargo build --release --workspace --examples --jobs 2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --jobs 2 -- -D warnings
      - run: cargo test --release --workspace --jobs 2 --no-fail-fast --lib --bins --examples --test board --test chat_probe --test chat_probe_gemma --test cs04a --test cs05 --test cs08 --test cs10 --test cs11 --test cs12 --test cs14 --test cs15 --test cs20 --test cs21 --test cs22 --test cs25 --test cs25_settle --test cs28 --test cx01 --test cx02 --test cx03 --test cx04 --test cx05 --test cx06 --test cx07 --test cx08 --test cx09 --test cx10 --test cx11 --test e2e1 --test e2e2 --test en_route --test gpu_guard --test lid_dual --test ov01 --test ov02 --test ov03 --test ov04 --test ov05 --test ov06 --test ov07 --test ov08 --test ov09 --test overlay_parity --test r8a_follow --test r8a_relay --test r8d_partial --test r8e_server --test r8f_eval --test r8f_live --test r8g_media --test r8g_sinks --test r8v_probe --test rp02 --test rp06 --test rp07 --test rp08 --test rp09 --test rp10 --test rp11 --test rp15_speaker --test rp16 --test rp16_lid --test rp16_sessions --test rp19 --test rp20 --test rp21 --test rp22 --test rp23 --test rp24 --test rp25 --test rp26 --test rp27 --test rp29 --test rp29_sink --test rp30 --test rp31 --test rp36 --test rp37 --test rp38 --test rp39 --test rp40 --test rp41 --test rp42 --test rp43 --test rp45 --test rp46 --test rp47 --test rp48 --test rp49 --test rp63 --test rp69 --test rp70 --test rp71 --test rp72 --test rp80 --test rp81 --test source_flag --test vad_threshold_probe --test vad_trace_probe --test vprobe --test w7_limit --test warmup_start -- --skip rp19_python_cases_are_ported --skip rp81_owned_exceptions_are_gone --skip a_missing_model_directory_leaves_every_stage_out_and_the_engine_silent --skip an_engine_with_no_route_has_no_early_holds --skip an_engine_with_no_route_has_no_recognizers_to_report --skip with_no_stage_on_the_gpu_there_is_nothing_to_give_back --skip missing_cuda_build_falls_through_to_the_cpu_build --skip hidden_gpu_translate_server_starts_on_cpu_with_a_reason --skip rp16_no_gpu_translate_server_falls_back_to_cpu_and_says_so
      - name: RP-19 rows not yet ported
        continue-on-error: true
        run: cargo test --release --jobs 2 -p hayamimi-eval --test rp19 -- --exact rp19_python_cases_are_ported
      - name: RP-81 owned exceptions
        continue-on-error: true
        run: cargo test --release --jobs 2 -p hayamimi-eval --test rp81 -- --exact rp81_owned_exceptions_are_gone
