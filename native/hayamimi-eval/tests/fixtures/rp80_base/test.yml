name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --jobs 2 -- -D warnings
      - run: cargo test --release --jobs 2 -p hayamimi-eval --test rp02 --test rp19 --test rp80 --test rp81
      - name: RP-19 rows not yet ported
        continue-on-error: true
        run: cargo test --release --jobs 2 -p hayamimi-eval --test rp19 -- --exact rp19_python_cases_are_ported
      - name: RP-81 owned exceptions
        continue-on-error: true
        run: cargo test --release --jobs 2 -p hayamimi-eval --test rp81 -- --exact rp81_owned_exceptions_are_gone
