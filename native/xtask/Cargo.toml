[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Developer tasks: build the CUDA flavour of the sherpa-onnx C library and record what was built."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints.rust]
unsafe_code = "forbid"
unused_mut = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
