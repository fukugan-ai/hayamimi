# Strings shown to an English reader, and English log and command-line text.

source_mark = "Original"
no_translation_mark = "Not translated"
withheld_mark = "[translation withheld]"

[annotation]
plain = "(about {values})"
currency = "(about {values}, rate of {date})"
join = ", "
date = "{mon} {d}"
months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

[unit.usd]
label = "$"
prefix = true
space = false

[unit.mile]
label = "mile"

[unit.ft]
label = "ft"

[unit.inch]
label = "inch"

[unit.lb]
label = "lb"

[unit.oz]
label = "oz"

[unit.f]
label = "°F"
space = false

[unit.us_gallon]
label = "US gallon"

[unit.us_floz]
label = "US fl oz"

[unit.sqft]
label = "sq ft"

[unit.m2]
label = "m²"

[messages]
"fx.fetch.ok" = "Exchange rates saved"
"fx.fetch.failed" = "Exchange rate fetch failed; the previous file stays in use"
"table.load.failed" = "A table file could not be read; the previous content stays in use"
"translate.line.ok" = "Translation emitted"
"translate.line.held" = "Verification failed; translation withheld"
"translate.request.failed" = "The translator could not be reached"
"translate.fallback.held" = "The translator cannot be reached; translations are held and the original lines go on"
"translate.fallback.cleared" = "The translator is reachable again; translations resume"
"annotate.line.added" = "Conversion added"
"annotate.line.skipped" = "Conversion skipped"
"schedule.task.installed" = "Daily fetch registered"
"schedule.task.removed" = "Daily fetch removed"
"schedule.task.failed" = "Scheduler operation failed"
"events.subscribe.opened" = "Following the recognizer's events"
"events.subscribe.lost" = "The recognizer's events stopped; connecting again"
"events.line.skipped" = "An event that looks like a line could not be used"
"translate.line.skipped" = "The line is not translated; its original is shown"
"translate.lane.failed" = "A translation lane could not take the line"
"translate.publish.failed" = "A translation could not be written out"
"relay.serve.started" = "Serving translations"
"server.fallback.port" = "The requested port was taken; another one is used"
"translate.edit.held" = "The edited translation failed verification; the first translation stands"
"translate.send.ok" = "A caption was sent"
"translate.send.failed" = "A caption could not be sent"
"translate.deliver.failed" = "A translation could not be handed to the outputs"
"sink.fallback.local" = "A destination could not be reached; translations are kept in the subtitle file and on the screens"
"sink.fallback.cleared" = "The destinations are reachable again"
"srt.cue.skipped" = "A line has no cue in the subtitle file"
"srt.output.failed" = "The subtitle file could not be written; it is left out"

[cli]
usage = """usage:
  hayamimi-relay live [--llm <url>] [--serve <port>] [--events <url>]... [--srt <file>]
  hayamimi-relay fx-fetch [--out <file>] [--source-url <url>]
  hayamimi-relay fx-schedule --install|--remove [--task-name <name>] [--out <file>] [--source-url <url>]"""
unknown_command = "unknown subcommand"
missing_value = "an option is missing its value"
unknown_option = "unknown option"
need_install_or_remove = "one of --install or --remove is required"
no_default_dir = "cannot decide the default output location; pass --out"
bad_port = "--serve needs a port number from 0 to 65535"
cannot_serve = "cannot serve translations: no port could be opened"
serving_at = "translations are served at"
port_moved = "the requested port was taken; translations are served at"
sink_local = "a destination of captions cannot be reached; translations stay in the subtitle file and on the screens, and each next line tries again"
sink_cleared = "the destinations of captions are reachable again"
srt_not_opened = "the subtitle file could not be opened; the run goes on without it"
