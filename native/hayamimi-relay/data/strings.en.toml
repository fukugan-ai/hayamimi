# Strings shown to an English reader, and English log and command-line text.

source_mark = "Original"
no_translation_mark = "Not translated"
withheld_mark = "[translation withheld]"

[annotation]
plain = "(about {values})"
currency = "(about {values}, rate of {date})"
join = ", "
date = "{mon} {d}"
months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

[unit.usd]
label = "$"
prefix = true
space = false

[unit.mile]
label = "mile"

[unit.ft]
label = "ft"

[unit.inch]
label = "inch"

[unit.lb]
label = "lb"

[unit.oz]
label = "oz"

[unit.f]
label = "°F"
space = false

[unit.us_gallon]
label = "US gallon"

[unit.us_floz]
label = "US fl oz"

[unit.sqft]
label = "sq ft"

[unit.m2]
label = "m²"

[messages]
"fx.fetch.ok" = "Exchange rates saved"
"fx.fetch.failed" = "Exchange rate fetch failed; the previous file stays in use"
"table.load.failed" = "A table file could not be read; the previous content stays in use"
"translate.line.ok" = "Translation emitted"
"translate.line.held" = "Verification failed; translation withheld"
"translate.request.failed" = "The translator could not be reached"
"translate.request.retried" = "The translator closed the connection; the request was sent again"
"translate.fallback.held" = "The translator cannot be reached; translations are held and the original lines go on"
"translate.fallback.cleared" = "The translator is reachable again; translations resume"
"annotate.line.added" = "Conversion added"
"annotate.line.skipped" = "Conversion skipped"
"schedule.task.installed" = "Daily fetch registered"
"schedule.task.removed" = "Daily fetch removed"
"schedule.task.failed" = "Scheduler operation failed"
"events.subscribe.opened" = "Following the recognizer's events"
"events.subscribe.lost" = "The recognizer's events stopped; connecting again"
"events.line.skipped" = "An event that looks like a line could not be used"
"translate.line.skipped" = "The line is not translated; its original is shown"
"translate.lane.failed" = "A translation lane could not take the line"
"translate.publish.failed" = "A translation could not be written out"
"relay.serve.started" = "Serving translations"
"translate.warmup.sent" = "One short request was sent to the translator before serving, and it answered"
"translate.warmup.failed" = "The short request sent to the translator before serving failed; serving goes on"
"server.fallback.port" = "The requested port was taken; another one is used"
"translate.edit.held" = "The edited translation failed verification; the first translation stands"
"translate.draft.held" = "The first translation failed verification; the edited translation passed and goes out"
"translate.send.ok" = "A caption was sent"
"translate.send.failed" = "A caption could not be sent"
"translate.deliver.failed" = "A translation could not be handed to the outputs"
"sink.fallback.local" = "A destination could not be reached; translations are kept in the subtitle file and on the screens"
"sink.fallback.cleared" = "The destinations are reachable again"
"srt.cue.skipped" = "A line has no cue in the subtitle file"
"srt.output.failed" = "The subtitle file could not be written; it is left out"
"translate.fallback.skipped" = "The translator does not write this language; it is left out and the others go on"
"translate.hedge.logged" = "The hedging differs between the source and the translation; the translation went out"
"translate.dump.failed" = "The file for the translations handed to verification could not be opened; the run goes on without it"
"translate.eval.held" = "No translation of this sentence was kept"
"translate.eval.written" ="The translations of one language were written"
"srt.output.exists" = "A subtitle file for the video is there already; nothing is done"
"srt.extract.started" = "Taking the audio out of the video"
"srt.extract.failed" = "The audio could not be taken out of the video"
"srt.recognize.failed" = "The audio could not be recognized"
"srt.output.empty" = "The video holds no speech; no subtitle file is written"
"srt.output.written" = "The subtitle files are written"
"send.config.too_open" = "The file that holds the caption addresses can be read by others, or could not be checked; nothing is sent from it"
"translate.partial.ok" = "The text in progress was translated"
"translate.partial.held" = "Verification failed; the translation of the text in progress is not shown"
"translate.partial.aborted" = "A newer text took its place; the translation of the older one was dropped"
"translate.partial.failed" = "The translator could not be reached for the text in progress"
"translate.partial.skipped" = "The text in progress is not translated"
"translate.partial.kept" = "The translation would take away characters already drawn in the settled form; the screen keeps the earlier one"
"translate.slot.waited" = "Every slot of the translator was busy; the request waited for one to be free"

[cli]
usage = """usage:
  hayamimi-relay live [--llm <url>] [--llm-other <url>] [--serve <port>] [--serve-host <address>] [--events <url>]... [--srt <file>] [--send <send.toml>] [--translate <codes>] [--no-partial-translation] [--partial-yield <on|off>] [--verify-text <file>]
  hayamimi-relay eval --pairs <dir> --out <dir> [--llm <url>] [--llm-other <url>]
  hayamimi-relay srt <video> [--llm <url>] [--ffmpeg <program>] [--hayamimi <program>] [--models <dir>]
  hayamimi-relay fx-fetch [--out <file>] [--source-url <url>]
  hayamimi-relay fx-schedule --install|--remove [--task-name <name>] [--out <file>] [--source-url <url>]"""
unknown_command = "unknown subcommand"
missing_value = "an option is missing its value"
unknown_option = "unknown option"
need_install_or_remove = "one of --install or --remove is required"
no_default_dir = "cannot decide the default output location; pass --out"
bad_port = "--serve needs a port number from 0 to 65535"
bad_address = "--serve-host needs an IP address"
bad_partial_yield = "--partial-yield needs on or off"
cannot_serve = "cannot serve translations: no port could be opened"
serving_at = "translations are served at"
port_moved = "the requested port was taken; translations are served at"
lan_at = "open from another device on the network at"
lan_unknown = "this machine has no route to a network, so no address for other devices can be named; use the address of this machine with the port above"
sink_local = "a destination of captions cannot be reached; translations stay in the subtitle file and on the screens, and each next line tries again"
sink_cleared = "the destinations of captions are reachable again"
srt_not_opened = "the subtitle file could not be opened; the run goes on without it"
need_pairs_and_out = "eval needs --pairs and --out"
eval_target_skipped = "this language is not translated and is left out:"
eval_failed = "the translations could not be written"
send_not_opened = "the file of caption addresses could not be set up; nothing was started"
