[cli]
usage = """使い方:
  hayamimi-relay live [--llm <url>] [--serve <port>] [--events <url>]... [--srt <file>]
  hayamimi-relay eval --pairs <dir> --out <dir> [--llm <url>]
  hayamimi-relay fx-fetch [--out <file>] [--source-url <url>]
  hayamimi-relay fx-schedule --install|--remove [--task-name <名前>] [--out <file>] [--source-url <url>]"""
unknown_command = "知らない subcommand です"
missing_value = "値が足りない option があります"
unknown_option = "知らない option です"
need_install_or_remove = "--install か --remove のどちらかが要ります"
no_default_dir = "既定の保存先を決められません。--out を渡してください"
bad_port = "--serve には 0 から 65535 までの port の番号が要ります"
cannot_serve = "訳を配れません。開ける port がありません"
serving_at = "訳を次の URL で配っています"
port_moved = "頼んだ port が使えないので、訳を次の URL で配っています"
sink_local = "字幕の送り先に届きません。訳は SRT と画面に残し、次の行から送り直します"
sink_cleared = "字幕の送り先に届くようになりました"
srt_not_opened = "SRT を開けませんでした。SRT なしで続けます"
need_pairs_and_out = "eval には --pairs と --out が要ります"
