[cli]
usage = """使い方:
  hayamimi-relay live [--llm <url>] [--llm-other <url>] [--serve <port>] [--events <url>]... [--srt <file>] [--send <send.toml>] [--translate <codes>] [--no-partial-translation] [--verify-text <file>]
  hayamimi-relay eval --pairs <dir> --out <dir> [--llm <url>] [--llm-other <url>]
  hayamimi-relay srt <動画> [--llm <url>] [--ffmpeg <program>] [--hayamimi <program>] [--models <dir>]
  hayamimi-relay fx-fetch [--out <file>] [--source-url <url>]
  hayamimi-relay fx-schedule --install|--remove [--task-name <名前>] [--out <file>] [--source-url <url>]"""
unknown_command = "知らない subcommand です"
missing_value = "値が足りない option があります"
