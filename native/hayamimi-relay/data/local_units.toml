# Local units, unit spellings and conversion factors.
# A unit is read from the source text through `aliases` (after the number) or
# `prefix` (before the number). `place` lists extra spellings that are only
# used to find the same figure again inside a translation.
# A row converts `from` into `to` for the language that reads the subtitle:
#   to = (from + pre) * factor / divisor + post

[reader.ja]
currency = "jpy"

[reader.en]
currency = "usd"

# ---- currency -----------------------------------------------------------

[[unit]]
id = "usd"
kind = "currency"
aliases = ["USD", "dollar", "dollars", "ドル", "米ドル"]
prefix = ["US$", "$"]
place = []

[[unit]]
id = "jpy"
kind = "currency"
aliases = ["JPY", "yen", "円"]
prefix = []
place = []

[[unit]]
id = "gbp"
kind = "currency"
aliases = ["GBP", "pound sterling", "pounds sterling"]
prefix = ["£"]
place = ["pound", "pounds", "ポンド"]

[[unit]]
id = "cad"
kind = "currency"
aliases = ["CAD", "Canadian dollar", "Canadian dollars", "カナダドル"]
prefix = ["CA$", "C$"]
place = ["dollar", "dollars", "ドル"]

[[unit]]
id = "aud"
kind = "currency"
aliases = ["AUD", "Australian dollar", "Australian dollars", "豪ドル", "オーストラリアドル"]
prefix = ["AU$", "A$"]
place = ["dollar", "dollars", "ドル"]

[[unit]]
id = "eur"
kind = "currency"
aliases = ["EUR", "euro", "euros", "ユーロ"]
prefix = ["€"]
place = []

