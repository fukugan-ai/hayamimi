# 1 tsubo = 400/121 m2 (1 shaku = 10/33 m); 1 tatami = 1.62 m2 as used in listings.
[[conversion]]
reader = "en"
from = "tsubo"
to = "m2"
factor = 400.0
divisor = 121.0

[[conversion]]
reader = "en"
from = "tsubo"
to = "sqft"
via = "m2"

[[conversion]]
reader = "en"
from = "tatami"
to = "m2"
factor = 1.62

[[conversion]]
reader = "en"
from = "tatami"
to = "sqft"
via = "m2"
