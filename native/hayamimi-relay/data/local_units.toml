# ---- spellings that cannot be resolved to one unit ----------------------
# A figure followed by one of these is reported as skipped (ambiguous).

[[ambiguous]]
kind = "mass"
aliases = ["pound", "pounds", "ポンド", "ton", "tons", "トン"]

[[ambiguous]]
kind = "volume"
aliases = ["gallon", "gallons", "ガロン"]

[[ambiguous]]
kind = "length"
aliases = ["in", "キロ"]

[[ambiguous]]
kind = "temperature"
aliases = ["degree", "degrees"]

# ---- conversions for a Japanese reader ----------------------------------

[[conversion]]
reader = "ja"
from = "mile"
to = "km"
factor = 1.609344

[[conversion]]
reader = "ja"
from = "ft"
to = "m"
factor = 0.3048

[[conversion]]
reader = "ja"
from = "inch"
to = "cm"
factor = 2.54

[[conversion]]
reader = "ja"
from = "yd"
to = "m"
factor = 0.9144

[[conversion]]
reader = "ja"
from = "lb"
to = "kg"
factor = 0.4535924

[[conversion]]
reader = "ja"
from = "oz"
to = "g"
factor = 28.34952

[[conversion]]
reader = "ja"
from = "f"
to = "c"
pre = -32.0
divisor = 1.8

[[conversion]]
reader = "ja"
from = "us_gallon"
to = "l"
factor = 3.785412

[[conversion]]
reader = "ja"
from = "us_floz"
to = "ml"
factor = 29.57353

[[conversion]]
reader = "ja"
from = "sqft"
to = "m2"
factor = 0.09290304

[[conversion]]
reader = "ja"
from = "acre"
to = "m2"
factor = 4046.873

