[package]
name = "hayamimi-relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "Translation relay for hayamimi: verification, unit annotation and exchange-rate fetching."

[lib]
name = "hayamimi_relay"
path = "src/lib.rs"

[[bin]]
name = "hayamimi-relay"
path = "src/main.rs"

[dependencies]
dirs = "7"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
toml = "1.1"
# ERROR POLICY: ureq is confined to the llama-server client and the rate fetch; both map its errors to concrete enums.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
unused_mut = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
