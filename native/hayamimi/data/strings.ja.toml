llama_help = """hayamimi llama: 翻訳の model の server（llama.cpp の llama-server）を起こす

使い方: hayamimi llama start --model <file> [options]

server は、GPU が在れば GPU で、無ければ CPU で動く。
この command と端末が終わった後も動き続ける。止めるときは task manager から止める。

options:
  --model <file>   install の models/llm の中の model の file 名、または path
  --port <n>       待ち受ける port。127.0.0.1 だけで待つ（既定は 8080）
  --wait <sec>     model の読み込みを待つ秒数（既定は 180）
  --dir <dir>      install の directory（既定は利用者の local data directory の hayamimi）
  --help           この文を出す"""
llama_unknown_command = "知らない command です。使い方: hayamimi llama start --model <file>"
llama_need_model = "model が要ります。--model <file> を渡してください。"
llama_no_data_dir = "local data directory が分かりません。--dir <dir> を渡してください。"
llama_model_missing = "model の file がありません:"
llama_started = "翻訳 server は次の address で応答しています:"
llama_running = "翻訳 server はすでに次の address で応答しています:"
llama_unavailable = "翻訳 server を起こせませんでした。訳を保留して原文の字幕を出し続けます。上の log の event を見てください。"
models_help = """hayamimi models: 各段が読む model の file を取得します

usage: hayamimi models fetch [options]

file の組ごとに、まず sherpa-onnx の release から、次に Hugging Face から取得します。
既に揃っている組は取得し直しません。どの取得先からも得られない組があっても、
既に在る file を残して終了 code は 0 のままです。

options:
  --minimal          日本語と英語の核だけ（認識器、言語判定、VAD、句読点）
  --en-parakeet-v2   英語専用の Parakeet v2 認識器も取得します
  --punct-4class     4 クラスの日本語句読点 model も取得します
  --dir <dir>        model の directory（既定: models）
  --release-url <u>  sherpa-onnx の release の取得元の base address
  --hf-url <u>       Hugging Face の base address
  --help             この文を表示します"""
models_unknown_command = "不明な command です。次の形で使います: hayamimi models fetch"
models_present = "既に在ります:"
models_fetched = "取得しました:"
