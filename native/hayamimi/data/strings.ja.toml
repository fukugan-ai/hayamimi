[cli]
help = """hayamimi: 日本語の実時間音声認識（GPU が無ければ CPU で動く）

使い方: hayamimi (--wav <file> | --input <kind>) [options]

options:
  --wav <file>         この 16 bit の wav を文字に起こす
  --no-realtime        file を音声の速さに合わせず、続けて流す
  --input <kind>       音声の入り口。wav、mic、speaker、mix、ws のどれか（既定は wav）
  --mic-device <name>  開くマイク。名前の一部で選ぶ（既定は system のもの）
  --speaker-device <name>  取り込む出力の device。名前の一部で選ぶ（既定は system のもの）
  --ws-port <port>     この port で /ingest の音声の client を待つ（--input ws の既定は 8766）
  --ws-host <address>  /ingest が待つ address（既定は 127.0.0.1）
  --source <name>      字幕に書く source。mic、loopback、file のどれか（既定は入力のもの）
  --no-partial         発話の途中の速報を出さない
  --mode <mode>        balanced（既定）、fast、pair、single。発話ごとの言語の決め方（pair は発話ごとに日本語か英語で読む）
  --lang <code>        この言語で全部読み、言語判定をしない（ja、en、zh、ko、yue など）
  --models <dir>       model の directory を置いた directory（既定は models）
  --min-silence <sec>  発話の終わりにする無音の秒数（既定は 0.30）
  --max-speech <sec>   この秒数の発話が続いたら確定する（既定は 12）
  --endpoint <rule>    early（既定）は短い無音で完結した文を確定する、silence は --min-silence の無音を待つ
  --replace <file>     置換辞書。1 行に wrong=right を 1 つ
  --serve [port]       字幕の event を /events で配る（既定の port は 8833）
  --serve-host <address>  --serve が待つ address（既定は 127.0.0.1。0.0.0.0 にすると network へ開く）
  --max-resident <n>   日本語の認識器のほかに memory へ置く認識器の数（既定は 3。0 なら全部）
  --gpu-budget <MiB>   使用中の GPU memory がこの値になったら段を CPU へ移す（既定は 14000）
  --gpu-diagnose       GPU の model の node がどこへ置かれたかを log に出す
  --no-refine          確定した発話の group を読み直さない
  --help               この文を出す"""
