[cli]
help = """hayamimi: 日本語の実時間音声認識（GPU が無ければ CPU で動く）

使い方: hayamimi (--wav <file> | --input <kind>) [options]

options:
  --wav <file>         この 16 bit の wav を文字に起こす
  --no-realtime        file を音声の速さに合わせず、続けて流す
  --input <kind>       音声の入り口。wav、mic、speaker、mix、ws のどれか（既定は wav）
  --mic-device <name>  開くマイク。名前の一部で選ぶ（既定は system のもの）
  --speaker-device <name>  取り込む出力の device。名前の一部で選ぶ（既定は system のもの）
  --ws-port <port>     この port で /ingest の音声の client を待つ（--input ws の既定は 8766）
  --ws-host <address>  /ingest が待つ address（既定は 127.0.0.1）
  --source <name>      字幕に書く source。mic、loopback、file のどれか（既定は入力のもの）
  --no-partial         発話の途中の速報を出さない
  --mode <mode>        言語の mode。使えるのは single だけ（既定は single）
  --lang <code>        音声の言語。使えるのは ja だけ（既定は ja）
  --models <dir>       model の directory を置いた directory（既定は models）
  --min-silence <sec>  発話の終わりにする無音の秒数（既定は 0.30）
  --max-speech <sec>   この秒数の発話が続いたら確定する（既定は 12）
  --replace <file>     置換辞書。1 行に wrong=right を 1 つ
  --serve [port]       字幕の event を /events で配る（既定の port は 8833）
  --gpu-diagnose       GPU の model の node がどこへ置かれたかを log に出す
  --help               この文を出す"""
usage_hint = "使える option は --help で見られます。"
unknown_option = "知らない option です。"
missing_value = "option に値がありません。"
bad_number = "option には正の数が要ります。"
mode_unsupported = "使える --mode は single だけです。"
lang_unsupported = "使える --lang は ja だけです。"
need_wav = "入力が要ります。--wav <file>、または --input の mic、speaker、mix、ws を渡してください。"
unknown_input = "--input に渡せるのは wav、mic、speaker、mix、ws です。"
bad_address = "--ws-host には IP address が要ります。"
no_gpu_check = "GPU と driver は次の command で確かめられます: nvidia-smi"
run_failed = "実行に失敗しました:"
stage_punct = "落ちた段: 句読点"
stage_recognizer = "落ちた段: 認識器"
stage_vad = "落ちた段: 発話の検出"
stage_asr = "落ちた段: 認識"
stage_events = "落ちた段: 字幕の server"
stage_replace = "落ちた段: 置換辞書"
stage_source = "落ちた段: 字幕の source（--source）"
reason_bad_value = "理由: 値が mic、loopback、file のどれでもありません。"
stage_ingest = "落ちた段: 音声の client の server（/ingest）"
stage_capture = "落ちた段: 音声の取り込み"
reason_device_missing = "理由: 音声の device がありません。"
stage_translate = "落ちた段: 翻訳 server"
stage_lid = "落ちた段: 言語の判定"
stage_second_opinion = "落ちた段: 日本語の二度読み"
