# 日本語の読み手に見せる command line と log の文言。

[messages]
"gpu.device.unavailable" = "使える CUDA の device が無いので、GPU に置いた段を CPU で動かします"
"gpu.session.created" = "model の session を作りました"
"gpu.session.placed" = "model の node を置きました"
"asr.utterance.timed" = "発話を確定しました"
"asr.punct.failed" = "句読点の復元に失敗したので、句読点なしの文で続けました"
"asr.engine.failed" = "認識の経路が失敗しました"
"gpu.fallback.cpu" = "段を GPU から CPU へ落として続けます"
"model.fallback.disabled" = "model が使えないので、その段を外して続けます"
"asr.fallback.disabled" = "推論の library を開けないので、認識を外して続けます"
"server.fallback.port" = "port が使えないので、別の port で続けます"
"config.fallback.default" = "設定の file を読めないので、既定の設定で続けます"
"asr.model.loaded" = "認識器を読み込みました"
"asr.model.evicted" = "上限を守るため、最も使われていない認識器を手放しました"
"asr.lang.unknown" = "SenseVoice の結果の言語の tag を読めないので、言語は不明として扱います"
"gpu.memory.unreadable" = "GPU の memory を読めないので、memory の予算なしで続けます"
"model.fallback.substitute" = "認識器が使えないので、別の認識器が代わりに答えます"
"model.fallback.chunks" = "発話の検出器が使えないので、長い音声を一定の長さで切って続けます"

[cli]
help = """hayamimi: 日本語の実時間音声認識（GPU が無ければ CPU で動く）

使い方: hayamimi --wav <file> [options]

options:
  --wav <file>         この 16 bit の wav を文字に起こす
  --no-realtime        file を音声の速さに合わせず、続けて流す
  --mode <mode>        言語の mode。使えるのは single だけ（既定は single）
  --lang <code>        音声の言語。使えるのは ja だけ（既定は ja）
  --models <dir>       model の directory を置いた directory（既定は models）
  --min-silence <sec>  発話の終わりにする無音の秒数（既定は 0.30）
  --max-speech <sec>   この秒数の発話が続いたら確定する（既定は 12）
  --replace <file>     置換辞書。1 行に wrong=right を 1 つ
  --serve [port]       字幕の event を /events で配る（既定の port は 8833）
  --max-resident <n>   日本語の認識器のほかに memory へ置く認識器の数（既定は 3。0 なら全部）
  --gpu-budget <MiB>   使用中の GPU memory がこの値になったら段を CPU へ移す（既定は 14000）
  --gpu-diagnose       GPU の model の node がどこへ置かれたかを log に出す
  --help               この文を出す"""
usage_hint = "使える option は --help で見られます。"
unknown_option = "知らない option です。"
missing_value = "option に値がありません。"
bad_number = "option には正の数が要ります。"
