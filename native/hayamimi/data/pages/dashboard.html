<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hayamimi</title>
<style>
  body { margin: 0; background: #0d0f13; color: #ece5d8; display: flex; flex-direction: column;
         height: 100vh; font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  header { padding: .8rem 1.4rem; border-bottom: 1px solid #2a2f3a; display: flex; gap: 1rem; }
  #partial { padding: 1rem 1.4rem; min-height: 3rem; background: #14171d; font-size: 1.3rem; }
  #partial.idle { opacity: .5; }
  #feed { flex: 1; overflow-y: auto; padding: 1rem 1.4rem; }
  .card { padding: .4rem 0; border-bottom: 1px dashed #2a2f3a; }
  .lat { color: #b0a898; font-size: .75rem; margin-left: .8rem; }
  footer { padding: .4rem 1.4rem; border-top: 1px solid #2a2f3a; font-size: .75rem; color: #b0a898; }
</style>
<header>
  <b>hayamimi</b>
  <span>確定 <b id="n">0</b></span>
  <span>平均応答 <b id="mean">&ndash;</b> ms</span>
</header>
<div id="partial" class="idle">&hellip;</div>
<div id="feed"></div>
<footer><span id="conn">connecting&hellip;</span> &middot; overlay: / &middot; transcript: /transcript</footer>
<script>
  const feed = document.getElementById("feed");
  const partial = document.getElementById("partial");
  let finals = 0, latSum = 0, idleTimer = null;
  const es = new EventSource("/events");
  es.onopen = () => { document.getElementById("conn").textContent = "connected"; };
  es.onerror = () => { document.getElementById("conn").textContent = "reconnecting…"; };
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "partial") {
      partial.classList.remove("idle");
      partial.textContent = ev.text;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => partial.classList.add("idle"), 4000);
    } else if (ev.type === "final") {
      const card = document.createElement("div");
      card.className = "card";
      card.appendChild(document.createTextNode(ev.text));
      if (ev.latency_ms != null) {
        const lat = document.createElement("span");
        lat.className = "lat";
        lat.textContent = Math.round(ev.latency_ms) + "ms";
        card.appendChild(lat);
        latSum += ev.latency_ms;
      }
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      finals++;
      document.getElementById("n").textContent = finals;
      document.getElementById("mean").textContent = Math.round(latSum / finals);
    }
  };
</script>
</html>
