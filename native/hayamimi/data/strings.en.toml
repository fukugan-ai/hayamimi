[cli]
help = """hayamimi: real-time Japanese speech recognition (runs on the CPU when there is no GPU)

usage: hayamimi (--wav <file> | --input <kind>) [options]

options:
  --wav <file>         transcribe this 16-bit wav file
  --no-realtime        do not pace the file at the speed of the audio
  --input <kind>       where the audio comes from: wav, mic, speaker, mix or ws (default wav)
  --mic-device <name>  microphone to open, by part of its name (default: the system's)
  --speaker-device <name>  output device to capture, by part of its name (default: the system's)
  --ws-port <port>     listen for audio clients at /ingest on this port (default 8766 with --input ws)
  --ws-host <address>  address /ingest listens on (default 127.0.0.1)
  --source <name>      source named in the subtitles: mic, loopback or file (default: that of the input)
  --no-partial         do not show drafts of the utterance in progress
  --mode <mode>        balanced (default), fast, or single: how the language of each utterance is chosen
  --lang <code>        read everything in this language and identify none (ja, en, zh, ko, yue, ...)
  --models <dir>       directory that holds the model directories (default models)
  --min-silence <sec>  silence that ends an utterance (default 0.30)
  --max-speech <sec>   speech after which an utterance is finalised (default 12)
  --endpoint <rule>    early (default) finalises a complete sentence at a short silence, silence waits for --min-silence
  --replace <file>     replacement dictionary, one wrong=right per line
  --serve [port]       serve the subtitle events at /events (default port 8833)
  --serve-host <address>  address --serve listens on (default 127.0.0.1; 0.0.0.0 opens it to the network)
  --max-resident <n>   recognizers kept in memory besides the Japanese one (default 3; 0 keeps all)
  --gpu-budget <MiB>   GPU memory in use at which a stage moves to the CPU (default 14000)
  --gpu-diagnose       log where the nodes of each GPU model were placed
  --help               show this text"""
usage_hint = "Run with --help for the options."
