llama_help = """hayamimi llama: start the translation model server (llama.cpp's llama-server)

usage: hayamimi llama start --model <file> [options]

The server runs on the GPU when there is one and on the CPU when there is not.
It keeps running after this command and the terminal end; stop it from the task manager.

options:
  --model <file>   model file name in the install's models/llm directory, or a path
  --port <n>       port to listen on, on 127.0.0.1 (default 8080)
  --wait <sec>     how long to wait for the model to load (default 180)
  --dir <dir>      the install directory (default: hayamimi in the user's local data directory)
  --help           show this text"""
llama_unknown_command = "Unknown command. Use: hayamimi llama start --model <file>"
llama_need_model = "A model is required: pass --model <file>."
llama_no_data_dir = "The local data directory is unknown: pass --dir <dir>."
llama_model_missing = "The model file is not there:"
llama_started = "The translation server answers at:"
llama_running = "A translation server already answers at:"
llama_unavailable = "The translation server could not be started. Lines are held and the original text goes on. See the log events above."
models_help = """hayamimi models: get the model files the stages read

usage: hayamimi models fetch [options]

Each group of files is fetched from the sherpa-onnx release first and from Hugging Face after it.
A group that is already complete is not fetched again. When no source gives a group, the files
already there are kept and the exit code is still 0.

options:
  --minimal          only the core of Japanese and English (recognizer, language ID, VAD, punctuation)
  --en-parakeet-v2   also the English-only Parakeet v2 recognizer
  --punct-4class     also the four-class Japanese punctuation model
  --dir <dir>        the models directory (default: models)
  --release-url <u>  base address of the sherpa-onnx release downloads
  --hf-url <u>       base address of Hugging Face
  --help             show this text"""
models_unknown_command = "Unknown command. Use: hayamimi models fetch"
